<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator-wrapper {
            perspective: 1000px;
        }

        .calculator {
            background: linear-gradient(145deg, #1e1e1e, #2a2a2a);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .display {
            background: linear-gradient(145deg, #0a0a0a, #151515);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .previous-operand {
            color: #888;
            font-size: 18px;
            min-height: 24px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .current-operand {
            color: #fff;
            font-size: 32px;
            font-weight: 500;
            text-align: right;
            min-height: 40px;
            margin-top: 8px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:active {
            transform: scale(0.95);
        }

        .number, .decimal {
            background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .number:hover, .decimal:hover {
            background: linear-gradient(145deg, #404040, #303030);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .operator {
            background: linear-gradient(145deg, #ff9500, #ff7f00);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 149, 0, 0.4);
        }

        .operator:hover {
            background: linear-gradient(145deg, #ffb040, #ff9500);
            box-shadow: 0 6px 20px rgba(255, 149, 0, 0.6);
        }

        .equals {
            background: linear-gradient(145deg, #34c759, #2fb75e);
            color: #fff;
            grid-column: span 2;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
        }

        .equals:hover {
            background: linear-gradient(145deg, #3dd66f, #34c759);
            box-shadow: 0 6px 20px rgba(52, 199, 89, 0.6);
        }

        .clear {
            background: linear-gradient(145deg, #ff453a, #ff3b30);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 67, 58, 0.4);
        }

        .clear:hover {
            background: linear-gradient(145deg, #ff5a52, #ff453a);
            box-shadow: 0 6px 20px rgba(255, 67, 58, 0.6);
        }

        .sqrt {
            background: linear-gradient(145deg, #5856d6, #5047d5);
            color: #fff;
            box-shadow: 0 4px 15px rgba(88, 86, 214, 0.4);
            font-size: 16px;
        }

        .sqrt:hover {
            background: linear-gradient(145deg, #6b69ff, #5856d6);
            box-shadow: 0 6px 20px rgba(88, 86, 214, 0.6);
        }

        .delete {
            background: linear-gradient(145deg, #ff9500, #ff7f00);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 149, 0, 0.4);
            font-size: 16px;
        }

        .delete:hover {
            background: linear-gradient(145deg, #ffb040, #ff9500);
            box-shadow: 0 6px 20px rgba(255, 149, 0, 0.6);
        }

        .title {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .calculator {
                padding: 20px;
                max-width: 100%;
                margin: 20px;
            }

            button {
                padding: 16px;
                font-size: 16px;
            }

            .current-operand {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-wrapper">
        <div class="calculator">
            <div class="title">Calculator</div>
            
            <div class="display">
                <div class="previous-operand" id="previous"></div>
                <div class="current-operand" id="current">0</div>
            </div>

            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button class="delete" onclick="deleteLast()">DEL</button>
                <button class="operator" onclick="chooseOperation('/')">÷</button>
                <button class="operator" onclick="chooseOperation('*')">×</button>

                <button class="number" onclick="appendNumber('7')">7</button>
                <button class="number" onclick="appendNumber('8')">8</button>
                <button class="number" onclick="appendNumber('9')">9</button>
                <button class="operator" onclick="chooseOperation('-')">−</button>

                <button class="number" onclick="appendNumber('4')">4</button>
                <button class="number" onclick="appendNumber('5')">5</button>
                <button class="number" onclick="appendNumber('6')">6</button>
                <button class="operator" onclick="chooseOperation('+')">+</button>

                <button class="number" onclick="appendNumber('1')">1</button>
                <button class="number" onclick="appendNumber('2')">2</button>
                <button class="number" onclick="appendNumber('3')">3</button>
                <button class="operator" onclick="chooseOperation('**')">x²</button>

                <button class="number" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
                <button class="decimal" onclick="appendNumber('.')">.</button>
                <button class="operator" onclick="chooseOperation('%')">%</button>

                <button class="sqrt" onclick="calculateSquareRoot()">√</button>
                <button class="equals" onclick="compute()">=</button>
            </div>
        </div>
    </div>

    <script>
        let previousOperand = '';
        let currentOperand = '';
        let operator = null;

        function updateDisplay() {
            document.getElementById('current').innerText = currentOperand || '0';
            if (operator) {
                document.getElementById('previous').innerText = `${previousOperand} ${operator}`;
            } else {
                document.getElementById('previous').innerText = previousOperand;
            }
        }

        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            currentOperand = currentOperand.toString() + number.toString();
            updateDisplay();
        }

        function clearDisplay() {
            previousOperand = '';
            currentOperand = '';
            operator = null;
            updateDisplay();
        }

        function deleteLast() {
            currentOperand = currentOperand.toString().slice(0, -1);
            updateDisplay();
        }

        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operator = op;
            previousOperand = currentOperand;
            currentOperand = '';
            updateDisplay();
        }

        function calculateSquareRoot() {
            if (currentOperand === '') return;
            
            const num = parseFloat(currentOperand);
            if (num < 0) {
                currentOperand = 'Error: Negative number';
            } else {
                currentOperand = Math.sqrt(num);
            }
            operator = null;
            previousOperand = '';
            updateDisplay();
        }

        function compute() {
            if (operator == null || previousOperand === '' || currentOperand === '') return;
            
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);
            let result;

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        result = 'Error: Division by zero';
                    } else {
                        result = prev / current;
                    }
                    break;
                case '**':
                    result = prev ** current;
                    break;
                case '%':
                    if (current === 0) {
                        result = 'Error: Division by zero';
                    } else {
                        result = prev % current;
                    }
                    break;
                default:
                    return;
            }

            currentOperand = result;
            operator = null;
            previousOperand = '';
            updateDisplay();
        }

        // Initialize display
        updateDisplay();

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                compute();
            }
            if (e.key === 'Backspace') {
                e.preventDefault();
                deleteLast();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                clearDisplay();
            }
            if (e.key === '+') {
                e.preventDefault();
                chooseOperation('+');
            }
            if (e.key === '-') {
                e.preventDefault();
                chooseOperation('-');
            }
            if (e.key === '*') {
                e.preventDefault();
                chooseOperation('*');
            }
            if (e.key === '/') {
                e.preventDefault();
                chooseOperation('/');
            }
            if (e.key === '%') {
                e.preventDefault();
                chooseOperation('%');
            }
        });
    </script>
</body>
</html>
